serialization = "1.12.0"
security-crypto = "1.1.0"
camerax = "1.6.2"
mlkit-barcode = "17.3.0"
zxing = "3.5.4"
datetime = "0.7.1"
sqldelight = "2.4.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
